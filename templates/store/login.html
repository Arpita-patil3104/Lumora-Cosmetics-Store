{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In | LUMORA</title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <a
            href="{% url 'home' %}"
            class="auth-logo"
        >
            LUMORA
        </a>


        <div class="auth-label">
            WELCOME BACK
        </div>


        <h1>
            Sign in to LUMORA
        </h1>


        <p class="auth-subtitle">
            Continue your beauty journey with LUMORA.
        </p>


        {% if messages %}

            {% for message in messages %}

                <div class="auth-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                Sign In
            </button>

        </form>


        <div class="auth-bottom">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </div>


        <div class="auth-bottom">

            <a href="{% url 'home' %}">
                ← Continue Shopping
            </a>

        </div>

    </div>

</div>

</body>

</html>
